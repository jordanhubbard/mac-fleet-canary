[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mac-fleet-canary"
version = "0.1.0"
description = "Independent algorithm modules, used as a mac fleet parallel-execution canary"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["toolkit*"]

[tool.mypy]
python_version = "3.10"
strict = true
